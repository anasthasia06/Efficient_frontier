[project]
name = "portfolio-optimizer"
version = "1.0.0"
description = "Démonstrateur d'optimisation de portefeuille - Théorie de Markowitz"
authors = [
    { name = "Charly-Anasthasia" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.31.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "yfinance>=0.2.35",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamlit"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
