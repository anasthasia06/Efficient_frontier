[tool.hatch.build.targets.wheel]
packages = ["src/streamlit"]

[project]
name = "portfolio-optimizer"
version = "1.0.0"
description = "Démonstrateur d'optimisation de portefeuille - Théorie de Markowitz"
authors = [
    { name = "Charly-Anasthasia" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.31.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "yfinance>=0.2.35",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
    "sqlalchemy>=2.0.25",
]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"



