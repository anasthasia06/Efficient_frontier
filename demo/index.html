<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Optimizer — Démo</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #22c55e;
        --accent-hover: #16a34a;
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(180deg, #0b1220 0%, var(--bg) 100%);
        color: var(--text);
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      }

      main {
        width: min(100%, 460px);
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 24px 20px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.4rem, 4.5vw, 1.9rem);
        line-height: 1.2;
      }

      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.55;
      }

      .cta {
        display: inline-flex;
        width: 100%;
        justify-content: center;
        align-items: center;
        min-height: 56px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #052e16;
        font-weight: 700;
        font-size: 1.06rem;
        text-decoration: none;
        transition: background 0.2s ease;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .cta:hover,
      .cta:focus-visible {
        background: var(--accent-hover);
        outline: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Portfolio Optimizer</h1>
      <p>
        Lancez la démonstration directement dans votre navigateur mobile, sans installation d'application.
      </p>
      <a class="cta" href="/app/">Tester la démo</a>
    </main>
  </body>
</html>
