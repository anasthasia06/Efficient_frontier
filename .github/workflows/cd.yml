name: CD Render

# Ce workflow déploie un service Render après le succès de la CI sur la branche Charly.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_run:
    workflows:
      - CI 
    types:
      - completed

jobs:
  deploy-render:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'Charly' }}
    runs-on: ubuntu-latest
    steps:
      - name: Déployer le service Render
        run: |
          # Déclenche le déploiement via le webhook Render
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
