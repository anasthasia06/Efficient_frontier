name: CI


on:
  push:
    branches: [ main, dev_demo, Charly, Anasthasia ]
  pull_request:
    branches: [ main, dev_demo, Charly, Anasthasia ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --no-dev

      - name: Lint with flake8
        run: |
          uv pip install flake8
          export PATH="$HOME/.local/bin:$PATH"
          which flake8
          flake8 --version
          flake8 streamlit

      - name: Import check
        run: python -c "import streamlit.app; import streamlit.app_oop"

      - name: Build Docker image
        run: docker build -t efficient_frontier .

