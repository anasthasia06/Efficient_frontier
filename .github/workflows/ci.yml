name: CI

on:
  push:
    branches: [ main, dev_demo, Charly, Anasthasia ]
  pull_request:
    branches: [ main, dev_demo, Charly, Anasthasia ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          pip install uv

      - name: Sync dependencies
        run: |
          uv sync --no-dev

      - name: Lint with Ruff
        run: |
          uv pip install ruff
          ruff streamlit

      - name: Run basic tests (import check)
        run: |
          python -c "import streamlit.app; import streamlit.app_oop"

      - name: Build Docker image
        run: |
          docker build -t efficient_frontier .
