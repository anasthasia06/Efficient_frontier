# Portfolio Optimizer - Docker Compose
# Orchestration des conteneurs pour les applications mobile et desktop

version: '3.9'

services:
  # ============================================
  # Application Streamlit (Desktop)
  # ============================================
  streamlit:
    build:
      context: ./apps/streamlit
      dockerfile: Dockerfile
    container_name: portfolio-optimizer-streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      # Montage du code source pour le développement
      - ./apps/streamlit:/app:cached
      # Exclusion du cache Python
      - /app/__pycache__
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - portfolio-network
    labels:
      - "app.name=portfolio-optimizer-streamlit"
      - "app.description=Application desktop Streamlit pour optimisation de portefeuille"

  # ============================================
  # Application Mobile React Native / Expo
  # ============================================
  mobile:
    build:
      context: ./apps/mobile
      dockerfile: Dockerfile
    container_name: portfolio-optimizer-mobile
    restart: unless-stopped
    ports:
      - "8081:8081"     # Metro bundler
      - "19000:19000"   # Expo Dev Server
      - "19001:19001"   # Expo DevTools
      - "19002:19002"   # Expo DevTools Web
    volumes:
      # Montage du code source pour le développement
      - ./apps/mobile:/app:cached
      # Exclusion de node_modules pour éviter les conflits
      - /app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    networks:
      - portfolio-network
    labels:
      - "app.name=portfolio-optimizer-mobile"
      - "app.description=Application mobile React Native Expo"

  # ============================================
  # API Backend (optionnel - pour partage de données)
  # ============================================
  # api:
  #   build:
  #     context: ./apps/api
  #     dockerfile: Dockerfile
  #   container_name: portfolio-optimizer-api
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./apps/api:/app:cached
  #   environment:
  #     - DATABASE_URL=sqlite:///./portfolio.db
  #   networks:
  #     - portfolio-network

# ============================================
# Réseau
# ============================================
networks:
  portfolio-network:
    driver: bridge
    name: portfolio-optimizer-network

