# Portfolio Optimizer - Docker Compose
# Orchestration des conteneurs pour les applications mobile et desktop

 

services:
  # ============================================
  # Application Streamlit (Desktop)
  # ============================================
  streamlit:
    build:
      context: ./apps/streamlit
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      # Montage du code source pour le développement
      - ./apps/streamlit:/app:cached
      # Exclusion du cache Python
      - /app/__pycache__
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - portfolio-network
    labels:
      - "app.name=portfolio-optimizer-streamlit"
      - "app.description=Application desktop Streamlit pour optimisation de portefeuille"

  # ============================================
  # Application Mobile React Native / Expo
  # ============================================
  mobile:
    build:
      context: ./apps/mobile
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"       # Metro bundler (USB reverse)
      - "127.0.0.1:19000:19000"     # Expo Dev Server (USB reverse)
      # DevTools ports retirés pour limiter l'exposition
    volumes:
      # Montage du code source pour le développement
      - ./apps/mobile:/app:cached
      # Volume dédié pour node_modules afin de conserver les dépendances dans le conteneur
      - mobile_node_modules:/app/node_modules
      # Cache npm persistant vers /data pour éviter ENOSPC
      - /data/npm-cache:/root/.npm
    environment:
      - EXPO_TOKEN=${EXPO_TOKEN}
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=127.0.0.1
      - REACT_NATIVE_PACKAGER_HOSTNAME=127.0.0.1
      - CHOKIDAR_USEPOLLING=true
      - NPM_CONFIG_CACHE=/root/.npm
    env_file:
      - ./.env
    # Démarrage: installe les dépendances si absentes, aligne les versions SDK Expo, purge le cache Metro, puis lance Expo en localhost (USB/ADB friendly)
    command: >-
      sh -lc "if [ ! -d node_modules ] || [ -z \"$$(ls -A node_modules 2>/dev/null)\" ]; then npm ci || npm install; fi; npx expo install && rm -rf node_modules/.cache && npx expo start --localhost"
    stdin_open: true
    tty: true
    networks:
      - portfolio-network
    labels:
      - "app.name=portfolio-optimizer-mobile"
      - "app.description=Application mobile React Native Expo"

  # ============================================
  # Builder Android SDK (Gradle) pour APK local
  # ============================================
  mobile-build:
    image: reactnativecommunity/react-native-android:latest
    working_dir: /app
    volumes:
      - ./apps/mobile:/app:cached
      # Caches et SDK lourds persistés sur /data
      - /data/android-sdk:/opt/android
      - /data/android-gradle-cache:/root/.gradle
      - /data/npm-cache:/root/.npm
      # Sortie de build (APK) hors racine FS
      - /data/android-build-output:/app/android/app/build
    environment:
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - ANDROID_HOME=/opt/android
      - ANDROID_SDK_ROOT=/opt/android
      - GRADLE_USER_HOME=/root/.gradle
      - NODE_ENV=production
      - CI=1
    command: bash -lc "npm install && npx expo install react-native-worklets || true && npx expo prebuild --platform android"
    networks:
      - portfolio-network
    labels:
      - "app.name=portfolio-optimizer-mobile-build"
      - "app.description=Service build Android SDK pour APK local"

  # ============================================
  # API Backend (optionnel - pour partage de données)
  # ============================================
  # api:
  #   build:
  #     context: ./apps/api
  #     dockerfile: Dockerfile
  #   container_name: portfolio-optimizer-api
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./apps/api:/app:cached
  #   environment:
  #     - DATABASE_URL=sqlite:///./portfolio.db
  #   networks:
  #     - portfolio-network

# ============================================
# Réseau
# ============================================
networks:
  portfolio-network:
    driver: bridge
    name: portfolio-optimizer-network

# ============================================
# Volumes persistants (optionnel)
# ============================================
volumes:
  mobile_node_modules:
    name: portfolio-mobile-node_modules
